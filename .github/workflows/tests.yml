# ─────────────────────────────────────────────────────────────
# Intégration continue : lance les tests automatiquement
# à chaque push sur main et à chaque Pull Request.
# ─────────────────────────────────────────────────────────────
name: Tests

on:
    push:
        branches: [main]
    pull_request:

# Principe du moindre privilège : le workflow peut seulement LIRE le dépôt.
permissions:
    contents: read

jobs:
    # ─── Moteur Python (la référence) ─────────────────────────
    tests:
        # Nom affiché dans GitHub, par exemple « Python 3.14 · windows-latest »
        name: Python ${{ matrix.python-version }} · ${{ matrix.os }}
        runs-on: ${{ matrix.os }}

        strategy:
            # Si une combinaison échoue, les autres continuent : on voit tout d'un coup
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                python-version: ["3.11", "3.14"] # version minimale déclarée + version actuelle

        steps:
            - name: Récupérer le code
              uses: actions/checkout@v7
              with:
                  # Le jeton d'accès n'est pas conservé après la récupération du code
                  persist-credentials: false

            - name: Installer Python ${{ matrix.python-version }}
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Installer le projet et les dépendances de test
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[dev]"

            # Inclut tests/test_vectors.py : le moteur Python valide shared/test-vectors.json
            - name: Lancer les tests
              run: pytest -v

            - name: Vérifier que la commande est bien installée
              run: password-checker --version

    # ─── Moteur TypeScript de l'interface web ─────────────────
    web:
        name: Web · Node 24
        runs-on: ubuntu-latest

        # Toutes les commandes « run » s'exécutent dans le dossier web/
        defaults:
            run:
                working-directory: web

        steps:
            - name: Récupérer le code
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Installer Node.js 24
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  # Met en cache les paquets npm, à partir du fichier de verrouillage
                  cache: npm
                  cache-dependency-path: web/package-lock.json

            # « npm ci » installe EXACTEMENT les versions du package-lock.json (reproductible)
            - name: Installer les dépendances
              run: npm ci

            - name: Vérifier les types
              run: npm run typecheck

            # Inclut web/tests/vectors.test.ts : même fichier de cas que le moteur Python
            - name: Lancer les tests
              run: npm test

            - name: Construire les fichiers du navigateur
              run: npm run build
